name: mangkuk_kembara
description: "MangkukKembara — Malaysia Heritage Treasure mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — MVVM ChangeNotifier pattern
  provider: ^6.1.2

  # Typography — heritage feel fonts
  google_fonts: ^6.2.1

  # Loading skeleton animations
  shimmer: ^3.0.0

  # Date and number formatting
  intl: ^0.19.0

  # Backend, signed media uploads, and device integrations
  supabase_flutter: ^2.16.0
  app_links: ^7.2.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  crop_your_image: ^2.0.0
  image: ^4.9.2
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  cached_network_image: ^3.4.1
  country_state_city: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/image/logo.png
    - asset/image/logo_light.png
    - asset/image/welcome_base_background.png
    - asset/image/mangkuk_kembara_logo_white.png
    - asset/image/mangkuk_kembara_logo_green.png
    - asset/image/penang_marker_photo.png
    - asset/image/kelantan_marker_photo.png
    - asset/image/melaka_marker_photo.png
    - asset/image/sarawak_marker_photo.png
    - asset/image/tiffin_background_green.png
    - asset/image/tiffin_background_yellow.png
    - asset/image/profile_background_green.png
    - asset/image/campaign_background.png
    - asset/image/artwork_campaign_card.png
    - asset/image/heritage_story_illustration.png
    - asset/image/artwork_story_background.png
    - asset/image/artwork_story_idea.png
    - asset/image/artwork_story_culture.png
    - asset/image/heritage_background.png
    - asset/image/artist_background.png
    - asset/image/nightmarket_tiffin_pin.png
    - asset/image/restaurant_tiffin_pin.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
